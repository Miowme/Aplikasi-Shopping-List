<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Shopping List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Shopping List</h1>

    <div class="input-container">
      <input
        type="text"
        id="itemInput"
        placeholder="Ketik nama item belanja..."
      />
      <button class="btn-add" id="addButton">Add Item</button>
    </div>

    <table>
      <thead>
        <tr>
          <th class="col-no">No</th>
          <th>Nama Item</th>
          <th class="col-action">Aksi</th>
        </tr>
      </thead>
      <tbody id="shoppingList">
        <tr id="emptyRow">
          <td colspan="3" class="empty-message">Belum ada item belanja.</td>
        </tr>
      </tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
