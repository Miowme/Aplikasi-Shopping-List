<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Shopping List dengan Fitur Edit</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px auto;
        max-width: 650px;
        padding: 0 20px;
        background-color: #f4f6f8;
      }

      h1 {
        text-align: center;
        color: #333;
      }

      .input-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .edit-input {
        width: 90%;
        padding: 6px;
        font-size: 14px;
      }

      button.btn-add {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button.btn-add:hover {
        background-color: #218838;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }

      th {
        background-color: #007bff;
        color: white;
      }

      tr:hover {
        background-color: #f1f1f1;
      }

      .col-no {
        width: 50px;
        text-align: center;
      }

      .col-action {
        width: 160px;
        text-align: center;
      }

      .btn-edit {
        padding: 6px 12px;
        font-size: 14px;
        background-color: #ffc107;
        color: #212529;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 4px;
      }

      .btn-edit:hover {
        background-color: #e0a800;
      }

      .btn-save {
        padding: 6px 12px;
        font-size: 14px;
        background-color: #17a2b8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 4px;
      }

      .btn-save:hover {
        background-color: #138496;
      }

      .btn-delete {
        padding: 6px 12px;
        font-size: 14px;
        background-color: #dc3545;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .btn-delete:hover {
        background-color: #c82333;
      }

      .empty-message {
        text-align: center;
        color: #777;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Shopping List</h1>

    <div class="input-container">
      <input
        type="text"
        id="itemInput"
        placeholder="Ketik nama item belanja..."
      />
      <button class="btn-add" id="addButton">Add Item</button>
    </div>

    <table>
      <thead>
        <tr>
          <th class="col-no">No</th>
          <th>Nama Item</th>
          <th class="col-action">Aksi</th>
        </tr>
      </thead>
      <tbody id="shoppingList">
        <tr id="emptyRow">
          <td colspan="3" class="empty-message">Belum ada item belanja.</td>
        </tr>
      </tbody>
    </table>

    <script>
      const itemInput = document.getElementById("itemInput");
      const addButton = document.getElementById("addButton");
      const shoppingList = document.getElementById("shoppingList");
      const emptyRow = document.getElementById("emptyRow");

      let items = JSON.parse(localStorage.getItem("shoppingListItems")) || [];

      let editIndex = -1;

      renderList();

      function renderList() {
        shoppingList
          .querySelectorAll("tr:not(#emptyRow)")
          .forEach((row) => row.remove());

        if (items.length === 0) {
          emptyRow.style.display = "";
        } else {
          emptyRow.style.display = "none";

          items.forEach((itemText, index) => {
            const tr = document.createElement("tr");

            if (index === editIndex) {
              tr.innerHTML = `
              <td class="col-no">${index + 1}</td>
              <td>
                <input type="text" class="edit-input" id="inputEdit-${index}" value="${itemText}">
              </td>
              <td class="col-action">
                <button class="btn-save" onclick="saveItem(${index})">Save</button>
                <button class="btn-delete" onclick="cancelEdit()">Batal</button>
              </td>
            `;
            } else {
              tr.innerHTML = `
              <td class="col-no">${index + 1}</td>
              <td>${itemText}</td>
              <td class="col-action">
                <button class="btn-edit" onclick="enableEdit(${index})">Edit</button>
                <button class="btn-delete" onclick="deleteItem(${index})">Delete</button>
              </td>
            `;
            }

            shoppingList.appendChild(tr);
          });
        }
      }

      function addItem() {
        const itemText = itemInput.value.trim();

        if (itemText === "") {
          alert("Silakan ketik nama item terlebih dahulu!");
          return;
        }

        items.push(itemText);
        saveToLocalStorage();
        renderList();

        itemInput.value = "";
        itemInput.focus();
      }

      function enableEdit(index) {
        editIndex = index;
        renderList();

        const editInput = document.getElementById(`inputEdit-${index}`);
        if (editInput) {
          editInput.focus();
          editInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
              saveItem(index);
            }
          });
        }
      }

      function saveItem(index) {
        const editInput = document.getElementById(`inputEdit-${index}`);
        const updatedText = editInput.value.trim();

        if (updatedText === "") {
          alert("Nama item tidak boleh kosong!");
          return;
        }

        items[index] = updatedText;
        editIndex = -1;
        saveToLocalStorage();
        renderList();
      }

      function cancelEdit() {
        editIndex = -1;
        renderList();
      }

      function deleteItem(index) {
        items.splice(index, 1);

        if (editIndex === index) {
          editIndex = -1;
        }

        saveToLocalStorage();
        renderList();
      }

      function saveToLocalStorage() {
        localStorage.setItem("shoppingListItems", JSON.stringify(items));
      }

      addButton.addEventListener("click", addItem);
      itemInput.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          addItem();
        }
      });
    </script>
  </body>
</html>
